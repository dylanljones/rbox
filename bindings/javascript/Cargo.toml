[package]
name = "rbox-js"
description = "Javascript library for interacting with the local and export data of Pioneers Rekordbox DJ software"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rbox            = { path = "../../rbox" }
# Default enable napi5 feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi            = { version = "3.2", default-features = false, features = ["napi5", "serde-json", "chrono_date", "error_anyhow"] }
napi-derive     = { version = "3.2"}
chrono          = { version = "0.4", features = ["serde"] }

[build-dependencies]
napi-build = "2.2"

[profile.release]
lto = true
strip = "symbols"
