# This workflow will run the Python tests

name: Python tests

on:
  # push:
  #   branches: ["*"]
  pull_request:
    types: [opened]
  workflow_dispatch:

env:
  working-directory: bindings/python
  PIP_DISABLE_PIP_VERSION_CHECK: "true"

permissions:
  actions: write
  contents: read

jobs:
  code-change:
    runs-on: ubuntu-latest
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          paths: '["rbox/**", "bindings/python/**]'
          paths_ignore: '[
            "rbox/README.md",
            "bindings/python/pyproject.toml",
            "bindings/python/requirements.txt",
            "bindings/python/README.md"
          ]'
    outputs:
      should_skip: fromJSON(steps.skip_check.outputs.should_skip)

  tests:
    needs: code-change
    if: ${{ !needs.code-change.outputs.should_skip}}
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest", "windows-latest", "macos-latest" ]
        python-version: [ "3.9", "3.13" ]  # check oldest and latest supported version
        other-os: [ true ]
    runs-on: ${{ matrix.os }}
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}
    defaults:
      run:
        working-directory: ${{ env.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # - name: Set Windows OpenSSL env
      #   if: runner.os == 'Windows'
      #   run: echo "OPENSSL_DIR=C:\Program Files\OpenSSL" >> $env:GITHUB_ENV

      - name: Set Perl environment variables
        if: runner.os == 'Windows'
        run: |
          echo "PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "OPENSSL_SRC_PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run Tests
        run: pytest tests
