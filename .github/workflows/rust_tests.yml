# This workflow will run the Rust tests

name: Rust tests

on:
  # push:
  #   branches: ["*"]
  pull_request:
    types: [opened]
  workflow_dispatch:

env:
  working-directory: rbox
  CARGO_TERM_COLOR: always

permissions:
  actions: write
  contents: read

jobs:

  code-change:
    runs-on: ubuntu-latest
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          paths: '["rbox/**"]'
          paths_ignore: '["rbox/README.md"]'
    outputs:
      should_skip: fromJSON(steps.skip_check.outputs.should_skip)

  cargo-fmt-check:
    needs: code-change
    if: ${{ !needs.code-change.outputs.should_skip}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check formatting
        run: cargo fmt --check

  test:
    needs:
      - cargo-fmt-check
      - code-change
    if: ${{ !needs.code-change.outputs.should_skip}}
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest", "macos-13"]
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    defaults:
      run:
        working-directory: ${{ env.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Perl environment variables
        if: runner.os == 'Windows'
        run: |
          echo "PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "OPENSSL_SRC_PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test --lib --bins --tests
