# This workflow will run the tests for the Python bindings and publish the package to PyPI.

name: Python

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  working-directory: bindings/python
  interpreter: 3.11 3.11 3.12 3.13 3.15
  PIP_DISABLE_PIP_VERSION_CHECK: "true"

jobs:

  linux:
    runs-on: ${{ matrix.platform.runner }}
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: true
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
    # needs: test
    defaults:
      run:
        working-directory: ${{ env.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.working-directory }}
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter ${{ env.interpreter }}
          sccache: 'false'
          manylinux: auto
          docker-options: -e OPENSSL_SRC_CONFIGURE_ARGS=no-asm
          before-script-linux: |
            # If we're running on rhel centos, install needed packages.
            if command -v yum &> /dev/null; then
                yum update -y && yum install -y perl-core openssl openssl-devel pkgconfig libatomic

                # If we're running on i686 we need to symlink libatomic
                # in order to build openssl with -latomic flag.
                if [[ ! -d "/usr/lib64" ]]; then
                    ln -s /usr/lib/libatomic.so.1 /usr/lib/libatomic.so
                fi
            else
                # If we're running on debian-based system.
                apt update -y && apt-get install -y libssl-dev openssl pkg-config
            fi

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: bindings/python/dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          # - runner: windows-latest
          #   target: x86
    # needs: linux
    defaults:
      run:
        working-directory: ${{ env.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}

      - name: Set Perl environment variables
        run: |
          echo "PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "OPENSSL_SRC_PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # - name: Install OpenSSL
      #   run: vcpkg install openssl:x64-windows-static-md

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.working-directory }}
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter ${{ env.interpreter }}
          sccache: 'true'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: bindings/python/dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    # needs: linux
    defaults:
      run:
        working-directory: ${{ env.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.working-directory }}
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter ${{ env.interpreter }}
          sccache: 'true'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: bindings/python/dist

  sdist:
    runs-on: ubuntu-latest
    # needs: linux
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: ${{ env.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.working-directory }}
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: bindings/python/dist

  test-wheels:
    needs: [linux, windows, macos]
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.15']
        platform:
          - {host: ubuntu-latest, artifact: wheels-linux-x86_64}
          - {host: windows-latest, artifact: wheels-windows-x64}
          - {host: macos-15-intel, artifact: wheels-macos-x86_64}
          - {host: macos-latest, artifact: wheels-macos-aarch64}
    runs-on: ${{ matrix.platform.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.platform.artifact }}
          path: ${{ runner.temp }}/wheels
      - name: Install built wheel and test dependencies
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install --no-index --find-links wheels --no-deps rbox
          python -m pip install pytest hypothesis typing-extensions
      - name: Test installed wheel outside the source package
        working-directory: ${{ runner.temp }}
        run: python -m pytest --import-mode=importlib "${{ github.workspace }}/bindings/python/tests"

  test-sdist:
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: wheels-sdist
          path: ${{ runner.temp }}/sdist
      - name: Build and import using only the source archive
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip wheel --no-deps --wheel-dir built-wheels sdist/*.tar.gz
          python -m pip install --no-index --find-links built-wheels --no-deps rbox
          python -m pip install typing-extensions
          python -c "from rbox import MasterDb, OneLibrary, RekordboxXml"

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, windows, macos, sdist, test-wheels, test-sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: bindings/python/dist
          pattern: wheels-*
          merge-multiple: true

      - name: List packages
        run: ls -R bindings/python/dist
        shell: bash

      - name: Publish to PyPI
        # if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          working-directory: ${{ env.working-directory }}
          command: upload
          args: --non-interactive --skip-existing dist/*
