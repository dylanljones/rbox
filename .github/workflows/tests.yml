# This workflow will run all tests

name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  actions: write
  contents: read

jobs:
  code-change:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
      paths_result: ${{ steps.skip_check.outputs.paths_result }}
      run_rs: ${{ !fromJSON(steps.skip_check.outputs.paths_result).rust.should_skip }}
      run_py: ${{ !fromJSON(steps.skip_check.outputs.paths_result).python.should_skip }}
      run_js: ${{ !fromJSON(steps.skip_check.outputs.paths_result).javascript.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          paths_filter: |
            rust:
              paths:
                - 'rbox/**'
              paths_ignore:
                - 'rbox/README.md'
            python:
              paths:
                - 'rbox/**'
                - 'bindings/python/**'
              paths_ignore:
                - 'rbox/README.md'
                - 'bindings/python/pyproject.toml'
                - 'bindings/python/requirements.txt'
                - 'bindings/python/README.md'
            javascript:
              paths:
                - 'rbox/**'
                - 'bindings/javascript/**'
              paths_ignore:
                - 'rbox/README.md'
                - 'bindings/javascript/.yarn/**'
                - 'bindings/javascript/.npmignore'
                - 'bindings/javascript/.yarnrc.yml'
                - 'bindings/javascript/README.md'
                - 'bindings/javascript/rustfmt.toml'
                - 'bindings/javascript/yarn.lock'

  cargo-fmt-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check formatting
        run: cargo fmt --check

  # -- Rust tests ----------------------------------------------------------------------------------

  test-rust:
    needs:
      - cargo-fmt-check
      - code-change
    if: needs.code-change.outputs.run_rs == 'true'
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]  # "macos-13"
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    defaults:
      run:
        working-directory: rbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Perl environment variables
        if: runner.os == 'Windows'
        run: |
          echo "PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "OPENSSL_SRC_PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test --lib --bins --tests

  # -- Python tests --------------------------------------------------------------------------------

  test-python:
    needs:
      - code-change
      - cargo-fmt-check
    if: needs.code-change.outputs.run_py == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest", "windows-latest", "macos-latest" ]
        python-version: [ "3.9", "3.13" ]  # check oldest and latest supported version
        other-os: [ true ]
    runs-on: ${{ matrix.os }}
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}
      PIP_DISABLE_PIP_VERSION_CHECK: "true"
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # - name: Set Windows OpenSSL env
      #   if: runner.os == 'Windows'
      #   run: echo "OPENSSL_DIR=C:\Program Files\OpenSSL" >> $env:GITHUB_ENV

      - name: Set Perl environment variables
        if: runner.os == 'Windows'
        run: |
          echo "PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "OPENSSL_SRC_PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run Tests
        run: pytest tests

  # -- Javascript tests ----------------------------------------------------------------------------

  build-javascript:
    needs:
      - code-change
      - cargo-fmt-check
    if: needs.code-change.outputs.run_js == 'true'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: yarn build --target x86_64-apple-darwin
          - host: windows-latest
            build: yarn build --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
            build: |
              rustup install 1.85.0 &&
              rustup default 1.85.0 &&
              yarn build --target x86_64-unknown-linux-gnu
          - host: macos-latest
            target: aarch64-apple-darwin
            build: yarn build --target aarch64-apple-darwin
    name: stable - ${{ matrix.settings.target }} - node@20
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        working-directory: bindings/javascript
    env:
      DEBUG: napi:*
      APP_NAME: rbox-js
      MACOSX_DEPLOYMENT_TARGET: '10.13'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup node
        if: ${{ !matrix.settings.docker }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          # cache-dependency-path: bindings/javascript

      # - name: Set Windows OpenSSL env
      #   if: runner.os == 'Windows'
      #   run: echo "OPENSSL_DIR=C:\Program Files\OpenSSL" >> $env:GITHUB_ENV

      - name: Set Perl environment variables
        if: runner.os == 'Windows'
        run: |
          echo "PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "OPENSSL_SRC_PERL=$((where.exe perl)[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install
        uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.settings.docker }}
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}

      - uses: goto-bus-stop/setup-zig@v2
        if: ${{ matrix.settings.target == 'armv7-unknown-linux-gnueabihf' || matrix.settings.target == 'armv7-unknown-linux-musleabihf' }}
        with:
          version: 0.13.0

      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash

      - name: Setup node x86
        if: matrix.settings.target == 'i686-pc-windows-msvc'
        run: yarn config set supportedArchitectures.cpu "ia32"
        shell: bash

      - name: Install dependencies
        run: yarn install

      - name: Setup node x86
        uses: actions/setup-node@v4
        if: matrix.settings.target == 'i686-pc-windows-msvc'
        with:
          node-version: 20
          cache: yarn
          architecture: x86

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build in docker
        uses: addnab/docker-run-action@v3
        if: ${{ matrix.settings.docker }}
        with:
          image: ${{ matrix.settings.docker }}
          options: '--user 0:0 -v ${{ github.workspace }}/.cargo-cache/git/db:/usr/local/cargo/git/db -v ${{ github.workspace }}/.cargo/registry/cache:/usr/local/cargo/registry/cache -v ${{ github.workspace }}/.cargo/registry/index:/usr/local/cargo/registry/index -v ${{ github.workspace }}:/build -w /build/bindings/javascript'
          run: ${{ matrix.settings.build }}

      - name: Build
        run: ${{ matrix.settings.build }}
        if: ${{ !matrix.settings.docker }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: bindings/javascript/${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  test-macOS-windows-javascript:
    name: Test bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs: build-javascript
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - host: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
          - host: macos-latest
            target: x86_64-apple-darwin
            architecture: x64
        node:
          - '18'
          - '22'
    runs-on: ${{ matrix.settings.host }}
    env:
      DEBUG: napi:*
      APP_NAME: rbox-js
      MACOSX_DEPLOYMENT_TARGET: '10.13'
    defaults:
      run:
        working-directory: bindings/javascript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
          cache-dependency-path: bindings/javascript
          architecture: ${{ matrix.settings.architecture }}

      - name: Install dependencies
        run: yarn install

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: bindings/javascript

      - name: List packages
        run: ls -R .
        shell: bash

      - name: Test bindings
        run: yarn test

  test-linux-x64-gnu-javascript:
    name: Test bindings on Linux-x64-gnu - node@${{ matrix.node }}
    needs: build-javascript
    strategy:
      fail-fast: false
      matrix:
        node:
          - '18'
          - '22'
    runs-on: ubuntu-latest
    env:
      DEBUG: napi:*
      APP_NAME: rbox-js
      MACOSX_DEPLOYMENT_TARGET: '10.13'
    defaults:
      run:
        working-directory: bindings/javascript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
          cache-dependency-path: bindings/javascript
          architecture: x64

      - name: Install dependencies
        run: yarn install

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: bindings/javascript

      - name: List packages
        run: ls -R .
        shell: bash

      # - name: Test bindings
      #   run: docker run --rm -v $(pwd):/build -w /build node:${{ matrix.node }}-slim yarn test

      - name: Test bindings
        run: yarn test
