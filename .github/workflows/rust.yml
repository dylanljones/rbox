name: Rust

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install system SQLCipher for standalone crate verification
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev pkg-config
      - name: Publish crate family in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          index_file=$(mktemp)
          trap 'rm -f "$index_file"' EXIT

          # Dependencies first; rbox-derives keeps its independent version.
          for crate in rbox-derives rbox-core rbox-db rbox-anlz rbox-setting \
                       rbox-xml rbox-masterdb rbox-onelib rbox; do
            version=$(jq -er --arg name "$crate" '.packages[] | select(.name == $name) | .version' <<< "$metadata")
            url="https://index.crates.io/${crate:0:2}/${crate:2:2}/$crate"
            status=$(curl --silent --show-error --retry 3 --max-time 30 \
              --output "$index_file" --write-out '%{http_code}' "$url")

            case "$status" in
              200)
                entry=$(jq -sc --arg version "$version" 'map(select(.vers == $version)) | first // empty' "$index_file")
                if [[ -n "$entry" ]]; then
                  if [[ $(jq -r '.yanked' <<< "$entry") == true ]]; then
                    echo "::error::$crate $version is yanked; choose a new version"
                    exit 1
                  fi
                  echo "Skipping published $crate $version"
                  continue
                fi
                ;;
              404) ;; # First release of this crate.
              *) echo "::error::Registry lookup failed for $crate (HTTP $status)"; exit 1 ;;
            esac

            cargo publish -p "$crate"
          done
