# This workflow will run the tests and publish the crate to crates.io.

name: Rust

on:
  # Triggers the workflow when a release is created
  release:
    types: [ published ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  working-directory: rbox

jobs:
  cargo-fmt-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check formatting
        run: cargo fmt --check

