[package]
name = "rbox-masterdb"
description = "Rekordbox Master database handler"
readme = "README.md"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

publish = true

[features]
default = ["bundled-vendored-openssl"]
# Features from rbox-db for SQLCipher support
bundled = ["rbox-db/bundled"]
bundled-vendored-openssl = ["rbox-db/bundled-vendored-openssl"]
# Features for the bindings
pyo3 = ["dep:pyo3", "dep:rbox-derives", "rbox-core/pyo3", "rbox-db/pyo3"]
napi = ["dep:napi", "dep:napi-derive", "rbox-core/napi", "rbox-db/napi"]

[dependencies]
chrono            = { workspace = true }
diesel            = { workspace = true, features = ["128-column-tables"] }
libsqlite3-sys    = { workspace = true }
thiserror         = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
quick-xml         = { workspace = true }
pyo3              = { workspace = true, optional = true }
napi              = { workspace = true, optional = true }
napi-derive       = { workspace = true, optional = true }
rand              = { workspace = true }
uuid              = { workspace = true }
dunce             = { workspace = true }

rbox-anlz         = { path = "../rbox-anlz", version = "0.2.0", default-features = false }
rbox-db           = { path = "../rbox-db", version = "0.2.0", default-features = false }
rbox-core         = { path = "../rbox-core", version = "0.2.0", default-features = false }
rbox-derives      = { path = "../rbox-derives", version = "0.2.0", optional = true }

[dev-dependencies]
rbox-db           = { path = "../rbox-db", version = "0.2.0", default-features = false, features = ["test-support"] }
anyhow            = { workspace = true }
tempfile          = { workspace = true }
rstest            = { workspace = true }
rbox-testing      = { path = "../rbox-testing" }
