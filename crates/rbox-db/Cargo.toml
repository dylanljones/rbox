[package]
name = "rbox-db"
description = "Rekordbox Sqlite database core"
readme = "README.md"
version.workspace = true
authors.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

publish = true

[features]
default = []
# Features for SQLCipher support
bundled = ["libsqlite3-sys/bundled-sqlcipher"]
bundled-vendored-openssl = ["libsqlite3-sys/bundled-sqlcipher-vendored-openssl"]
# Features for the bindings
pyo3 = ["dep:pyo3"]
napi = ["dep:napi", "dep:napi-derive"]

[dependencies]
diesel            = { workspace = true }
libsqlite3-sys    = { workspace = true }
thiserror         = { workspace = true }
pyo3              = { workspace = true, optional = true }
napi              = { workspace = true, optional = true }
napi-derive       = { workspace = true, optional = true }

[dev-dependencies]
tempfile          = { workspace = true }
