[workspace]
resolver = "3"
members = [
    "rbox",
    "bindings/*",
    "py-derives"
]

[workspace.package]
version = "0.1.4"
authors = ["Dylan Jones <dylanljones@proton.me>"]
description = "Library for interacting with the local and export data of Pioneers Rekordbox DJ software"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/dylanljones/rbox"
keywords = ["rekordbox", "dj", "database", "setting", "anlz"]
categories = ["multimedia::audio", "database", "parser-implementations", "value-formatting"]
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
anyhow          = { version = "1.0" }
chrono          = { version = "0.4", features = ["serde"] }
serde           = { version = "1.0", features = ["derive"] }
serde_json      = { version = "1.0" }
pyo3            = { version = "0.27", features = ["serde", "chrono"] }
napi            = { version = "3.5", default-features = false, features = ["napi5", "serde-json", "chrono_date"] }
napi-derive     = { version = "3.3"}
quote           = { version = "1.0" }
syn             = { version = "2.0", features = ["full", "extra-traits"] }
# proc-macro2     = { version = "1.0"  }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
