[workspace]
resolver = "3"
members = [
    "rbox",
    "bindings/*",
    "py-derives",
]

[workspace.package]
version = "0.1.4"
authors = ["Dylan Jones <dylanljones@proton.me>"]
description = "Library for interacting with the local and export data of Pioneers Rekordbox DJ software"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["rekordbox", "dj", "database", "setting", "anlz"]
repository = "https://github.com/dylanljones/rbox"
edition = "2021"

[workspace.dependencies]
anyhow          = { version = "1.0" }
chrono          = { version = "0.4", features = ["serde"] }
serde           = { version = "1.0", features = ["derive"] }
serde_json      = { version = "1.0" }
pyo3            = { version = "0.25", features = ["serde", "chrono"] }
napi            = { version = "3.2", default-features = false, features = ["napi5", "serde-json", "chrono_date"] }
napi-derive     = { version = "3.2"}

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
