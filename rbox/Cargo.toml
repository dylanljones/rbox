[package]
name = "rbox"
description = "Rust library for interacting with the local and export data of Pioneers Rekordbox DJ software"
readme = "README.md"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true

publish = true

[lib]
name = "rbox"

[features]
default = ["full", "bundled-vendored-openssl"]
full = ["master-db", "one-library", "device-library", "anlz", "xml", "settings"]

master-db = ["dep:rbox-masterdb", "dep:rbox-db", "anlz", "rbox-onelib?/master-db"]
one-library = ["dep:rbox-onelib", "dep:rbox-db"]
device-library = ["dep:rbox-devlib"]
anlz = ["dep:rbox-anlz"]
xml = ["dep:rbox-xml"]
settings = ["dep:rbox-setting"]

# Weak forwarding configures enabled components without enabling them.
bundled = ["rbox-db?/bundled", "rbox-masterdb?/bundled", "rbox-onelib?/bundled"]
bundled-vendored-openssl = ["rbox-db?/bundled-vendored-openssl", "rbox-masterdb?/bundled-vendored-openssl", "rbox-onelib?/bundled-vendored-openssl"]

# Features for the bindings
pyo3 = ["rbox-core/pyo3", "rbox-db?/pyo3", "rbox-masterdb?/pyo3", "rbox-onelib?/pyo3"]
napi = ["rbox-core/napi", "rbox-db?/napi", "rbox-masterdb?/napi", "rbox-onelib?/napi"]

[dependencies]
thiserror       = { workspace = true }

# The facade controls defaults, including the SQLCipher build strategy.
rbox-core       = { path = "../crates/rbox-core", version = "0.2.0", default-features = false }
rbox-db         = { path = "../crates/rbox-db", version = "0.2.0", default-features = false, optional = true }
rbox-masterdb   = { path = "../crates/rbox-masterdb", version = "0.2.0", default-features = false, optional = true }
rbox-onelib     = { path = "../crates/rbox-onelib", version = "0.2.0", default-features = false, optional = true }
rbox-devlib     = { path = "../crates/rbox-devlib", version = "0.2.0", default-features = false, optional = true }
rbox-anlz       = { path = "../crates/rbox-anlz", version = "0.2.0", default-features = false, optional = true }
rbox-xml        = { path = "../crates/rbox-xml", version = "0.2.0", default-features = false, optional = true }
rbox-setting    = { path = "../crates/rbox-setting", version = "0.2.0", default-features = false, optional = true }

[dev-dependencies]
anyhow          = { workspace = true }
criterion       = { workspace = true }
binrw           = { workspace = true }
tempfile        = { workspace = true }
rbox-testing    = { path = "../crates/rbox-testing" }

[[bench]]
name = "main"
harness = false
