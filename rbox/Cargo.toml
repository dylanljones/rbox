[package]
name = "rbox"
description = "Rust library for interacting with the local and export data of Pioneers Rekordbox DJ software"
readme = "README.md"
version.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true
repository.workspace = true
edition.workspace = true

[lib]
name = "rbox"

[features]
default = ["bundled"]
bundled = ["libsqlite3-sys/bundled-sqlcipher-vendored-openssl"]
# Features for the Python bindings
pyo3 = ["dep:pyo3", "dep:py-derives"]
# Features for the JavaScript bindings
napi = ["dep:napi", "dep:napi-derive"]

[dependencies]
serde            = { workspace = true }
serde_json       = { workspace = true }
chrono           = { workspace = true }
anyhow           = { version = "1.0.98" }
libsqlite3-sys   = { version = "0.33", features = ["bundled-sqlcipher-vendored-openssl"] }
diesel           = { version = "2.2", features = ["sqlite", "128-column-tables", "returning_clauses_for_sqlite_3_35"] }
rand             = { version = "0.9" }
uuid             = { version = "1.3", features = ["v4"] }
dirs             = { version = "6.0" }
quick-xml        = { version = "0.38", features = ["serialize"]}
binrw            = { version = "0.15" }
modular-bitfield = { version = "0.12" }
dunce            = { version = "1.0" }
lazy-regex       = { version = "3.4" }
sysinfo          = { version = "0.35" }
crc16            = { version = "0.4" }
parse-display    = { version = "0.10" }
# Binding dependencies
pyo3             = { workspace = true, optional = true }
napi             = { workspace = true, optional = true }
napi-derive      = { workspace = true, optional = true }
py-derives       = { path = "../py-derives", optional = true }
